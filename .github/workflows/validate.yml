name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false

          Get-ChildItem -Path . -Include *.ps1, *.psm1 -Recurse | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              if ($errors.Count -gt 0) {
                  $failed = $true
                  $errors | ForEach-Object {
                      Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
                  }
              }
          }

          if ($failed) {
              exit 1
          }

      - name: Smoke-test native Windows GUI
        shell: pwsh
        run: ./tests/windows_native_smoke.ps1

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r cross-platform/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q cross-platform tests

      - name: Run Python tests
        run: python -m unittest discover -s tests -v
